apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docbook
  labels:
    app: docbook
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docbook
      tier: frontend
  template:
    metadata:
      labels:
        app: docbook
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: rohan2747/docbook-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_TARGET
              value: "http://backend-service.docbook.svc.cluster.local:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: docbook
  labels:
    app: docbook
    tier: frontend
spec:
  type: NodePort
  selector:
    app: docbook
    tier: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
