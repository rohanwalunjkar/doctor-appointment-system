apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docbook
  labels:
    app: docbook
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docbook
      tier: frontend
  template:
    metadata:
      labels:
        app: docbook
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: docbook-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: docbook
  labels:
    app: docbook
    tier: frontend
spec:
  type: NodePort
  selector:
    app: docbook
    tier: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
