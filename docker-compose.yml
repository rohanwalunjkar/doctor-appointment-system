version: "3.8"

services:
  # ─── MySQL Database ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: docbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: doctor_appointment_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: docbook-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:root123@mysql:3306/doctor_appointment_db
      SECRET_KEY: your-super-secret-key-change-this-in-production
      FRONTEND_URL: http://localhost:3000
      DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── React Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: docbook-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
